<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Swap</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Skill Swap</h1>
      </div>
      <div class="controls">
        <label for="categoryFilter">Filter:</label>
        <select id="categoryFilter">
          <option value="all">All categories</option>
          <option value="Technology">Technology</option>
          <option value="Languages">Languages</option>
          <option value="Music">Music</option>
          <option value="Career">Career</option>
        </select>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Add a skill</h2>
        <form id="skillForm">
          <label>
            Title
            <input type="text" name="title" placeholder="e.g. Python tutoring" required />
          </label>
          <label>
            Category
            <select name="category" required>
              <option value="Technology">Technology</option>
              <option value="Languages">Languages</option>
              <option value="Music">Music</option>
              <option value="Career">Career</option>
            </select>
          </label>
          <label>
            Price
            <input type="number" name="price" min="0" step="1" required />
          </label>
          <label>
            Description
            <textarea name="description" rows="4" placeholder="Describe the skill"></textarea>
          </label>
          <button type="submit">Create Skill</button>
        </form>
      </section>

      <section class="panel">
        <h2>Available skills</h2>
        <div id="summary"></div>
        <ul id="skillList" class="skill-list"></ul>
      </section>
    </main>

    <script src="./skillUtils.js"></script>
    <script src="./api-service.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
