<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Swap</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Skill Swap</h1>
    </header>

    <main class="container">
      <section class="card">
        <h2>Filter Skills</h2>
        <div class="filter-buttons">
          <button class="filter-btn active" data-category="All">All</button>
          <button class="filter-btn" data-category="Programming">Programming</button>
          <button class="filter-btn" data-category="Music">Music</button>
          <button class="filter-btn" data-category="Career">Career</button>
        </div>
        <div id="skillList" class="skill-list"></div>
      </section>

      <section class="card">
        <h2>Calculate Total Cost</h2>
        <form id="costForm">
          <label>
            Hourly Rate
            <input type="number" id="hourlyRate" min="0" step="0.01" value="20" required />
          </label>
          <label>
            Hours
            <input type="number" id="hours" min="0" step="0.5" value="2" required />
          </label>
          <button type="submit">Calculate</button>
        </form>
        <p class="result">Total: <strong id="totalCost">$40.00</strong></p>
      </section>

      <section class="card">
        <h2>Find My Match</h2>
        <form id="matchForm">
          <label>
            Category
            <select id="matchCategory">
              <option value="Programming">Programming</option>
              <option value="Music">Music</option>
              <option value="Career">Career</option>
            </select>
          </label>
          <label>
            Max Price
            <input type="number" id="maxPrice" min="0" step="1" value="30" required />
          </label>
          <button type="submit">Find Matches</button>
        </form>
        <ul id="matchResults" class="match-results"></ul>
      </section>
    </main>

    <script src="skillswap-functions.js"></script>
    <script src="script.js"></script>
  </body>
</html>
